# Dependencies held below latest stable in this repo, and why. Adds to the
# fleet-wide ~/src/utils/dependency-freshness.allowlist.yaml.

exceptions:
  - ecosystem: gittag
    package: design_system
    pinned: "0.3.1"
    latest_known: "0.4.0"
    reason: >-
      design_system 0.4.0 returns material_ui's ThemeData (Flutter 3.50's
      replacement for package:flutter/material.dart). The app is on Flutter
      3.47.9 and package:flutter/material.dart, so taking it means migrating
      every screen to material_ui and Flutter 3.50 in one go: its own task,
      not part of the rtdb_relay switch that tripped the gate.
    blocked_by: "migration:flutter-3.50-material_ui"
    expires: "2026-12-17"
  - ecosystem: toolchain
    package: flutter
    pinned: "3.47.9"
    latest_known: "3.50.0"
    reason: >-
      Flutter 3.50 deprecates package:flutter/material.dart in favour of
      material_ui, and `flutter analyze` treats every deprecated import as a
      fatal info, so the SDK bump is the material_ui migration itself. It
      lands together with design_system 0.4.0 (entry above), not in an
      unrelated script fix.
    blocked_by: "migration:flutter-3.50-material_ui"
    expires: "2026-12-17"
  - ecosystem: pypi
    package: httpx
    pinned: "0.28.1"
    latest_known: "0.29.0"
    reason: >-
      rtdb-relay 0.2.2 (the newest kuhyx/utils rtdb-relay tag, pinned here)
      requires httpx==0.28.1, so pip cannot resolve the venv with httpx
      0.29.0. utils' rtdb_relay already moved to 0.29.0 on its branch; take
      httpx together with the next rtdb-relay tag.
    blocked_by: "transitive:rtdb-relay@0.2.2"
