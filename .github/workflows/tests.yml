name: tests

# The Python suite (100% branch coverage is enforced by pyproject's addopts)
# and the full pre-commit gate, from the same dev venv setup_dev.sh builds.
# Two parallel jobs over a cached venv and hook store: in series and built
# from scratch they took 90 s, past the one-minute budget.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [pytest, pre-commit]
    name: python (${{ matrix.task }})
    steps:
      - uses: actions/checkout@v4
      - name: Check out the shared gates
        uses: actions/checkout@v4
        with:
          repository: kuhyx/utils
          path: .utils
      - name: Point the delegates at that checkout
        run: echo "UTILS_ROOT=$GITHUB_WORKSPACE/.utils" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.x"
      # The editable install points at this checkout's path, which is the same
      # on every run, so the restored venv is valid as-is.
      - name: Restore the dev venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ steps.py.outputs.python-version }}-${{ hashFiles('pyproject.toml', 'packages/code_runner/pyproject.toml') }}
      - name: Dev venv
        run: bash scripts/setup_dev.sh
      - if: matrix.task == 'pytest'
        uses: actions/setup-node@v4
        with:
          node-version: "26.13.1"
      # code_runner's sandbox tests need bwrap; Ubuntu 24.04 blocks the
      # unprivileged user namespaces it uses.
      - if: matrix.task == 'pytest'
        name: Sandbox, X display and system pytest
        run: |
          sudo apt-get update
          # python3-pytest(-cov): test_subset_run runs pytest from the system
          # python; without pytest-cov it rejects pyproject's --cov addopts
          # before the root conftest can re-run it under .venv.
          # xvfb: the gate's Tk tests skip with no X display, and the gate
          # modules they cover then fail the 100% coverage gate.
          sudo apt-get install -y bubblewrap xvfb python3-pytest python3-pytest-cov
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Ubuntu's AppArmor profile for pasta lets it exec only /usr/bin/**,
          # so pasta refused scripts/tutor_model_netfence.sh ("Permission
          # denied"). Unload every profile attached to pasta/passt, whatever
          # the file is named (26.04 has no usr.bin.passt); none found is an
          # error, not a skip. Arch, the live host, has no AppArmor.
          mapfile -t profiles < <(sudo grep -lsE '^[[:space:]]*profile[[:space:]]+[^[:space:]]+[[:space:]]+/usr/bin/pas(ta|st)' /etc/apparmor.d/* || true)
          if [ "${#profiles[@]}" -eq 0 ]; then
            echo "no AppArmor profile attached to pasta in /etc/apparmor.d"
            ls /etc/apparmor.d | grep -i pas || true
            sudo aa-status | grep -i pas || true
            exit 1
          fi
          echo "unloading: ${profiles[*]}"
          sudo apparmor_parser -R "${profiles[@]}"
      # TUTOR_TESTS_NEED_SANDBOX: a failed pasta/bwrap probe is a collection
      # error here, never a skip (tutor/tests/_capability.py).
      - if: matrix.task == 'pytest'
        name: Tests
        env:
          TUTOR_TESTS_NEED_SANDBOX: "1"
        run: xvfb-run -a .venv/bin/python -m pytest -p no:cacheprovider -q
      - if: matrix.task == 'pre-commit'
        name: Restore the pre-commit hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ steps.py.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - if: matrix.task == 'pre-commit'
        name: pre-commit (Python hooks)
        run: |
          .venv/bin/python -m pip install --quiet pre-commit
          # pytest: the pytest job runs the whole suite; the hook wants a
          # local pass stamp, which a CI checkout never has.
          SKIP=dependency-freshness,flutter-analyze,pytest .venv/bin/pre-commit run --all-files

  # The Flutter client: analyze + unit/widget tests. The Firebase identifiers
  # are gitignored (public repo), so CI compiles against empty placeholders.
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run tool/write_firebase_config.dart --placeholder
      - run: flutter test
