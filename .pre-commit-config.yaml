# tutor's commit gate: the same Python hooks as the sibling guard repos
default_language_version:
  python: python3
default_stages: [pre-commit]
fail_fast: false
exclude: ^build/
default_install_hook_types: [pre-commit, post-commit, post-merge, post-rewrite]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: debug-statements
      - id: name-tests-test
        args: [--pytest-test-first]
        exclude: ^(tutor/)?tests/(_[a-z][a-z_]*|conftest)\.py$
      - id: check-ast
      - id: mixed-line-ending
        args: [--fix=lf]
  - repo: local
    hooks:
      - id: no-noqa
        name: Block noqa comments
        entry: '(?i)#\s*(noqa|type:\s*ignore)'
        language: pygrep
        types: [python]
      - id: no-ruff-noqa
        name: Block ruff noqa file-level comments
        entry: '(?i)#\s*ruff:\s*noqa'
        language: pygrep
        types: [python]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix, --show-fixes]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]
  - repo: local
    hooks:
      # The dev venv (scripts/setup_dev.sh) has every runtime dependency, so
      # mypy runs strict with no disabled error codes.
      - id: mypy
        name: mypy (strict, dev venv)
        entry: .venv/bin/python -m mypy tutor tests packages/code_runner/code_runner
        language: system
        pass_filenames: false
        types: [python]
      - id: pylint
        name: pylint (dev venv)
        entry: .venv/bin/python -m pylint --rcfile=pyproject.toml --fail-under=10 tutor
        language: system
        pass_filenames: false
        types: [python]
      - id: pylint-code-runner
        name: pylint (packages/code_runner, its own rcfile)
        entry: .venv/bin/python -m pylint --rcfile=packages/code_runner/pyproject.toml --fail-under=10 packages/code_runner/code_runner
        language: system
        pass_filenames: false
        files: ^packages/code_runner/.*\.py$
      - id: pytest
        name: pytest (100% branch coverage)
        entry: .venv/bin/python -m pytest -p no:cacheprovider -q
        language: system
        pass_filenames: false
        types: [python]
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-c, pyproject.toml, --severity-level=high, --confidence-level=medium]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^(tests/|scripts/)
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args:
          - --skip=*.json,*.lock,.git,__pycache__,.venv
          - --ignore-words-list=nd,te,als,ans,ot,passt,checkin
          - --uri-ignore-words-list=produkt
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: bash -c 'printf "%s\0" "$@" | xargs -0 -n 40 shellcheck --severity=warning' --
        language: system
        types: [shell]
      - id: file-length
        name: file length <= 250 lines
        entry: scripts/check_file_length.sh
        language: system
      - id: no-silent-failures
        name: Block silent failures (swallowed exceptions must log why)
        entry: python3 scripts/check_silent_failures.py
        language: system
        types: [python]
        # code_runner turns hostile sandbox output into error results on purpose;
        # moved verbatim from utils (follow-up: log those handlers, drop this).
        exclude: ^packages/code_runner/
      - id: md-naming
        name: markdown naming convention
        entry: scripts/check_md_naming.sh
        language: system
        files: \.(md|markdown)$

      - id: todo-closer
        name: close Todo trailer tasks
        entry: scripts/todo_hooks.sh closer
        language: system
        stages: [post-commit]
        always_run: true
        pass_filenames: false

      - id: todo-import-pr-merge
        name: import PR Todo sections (pull)
        entry: scripts/todo_hooks.sh import-pr post-merge
        language: system
        stages: [post-merge]
        always_run: true
        pass_filenames: false

      - id: todo-import-pr-rewrite
        name: import PR Todo sections (pull --rebase)
        entry: scripts/todo_hooks.sh import-pr post-rewrite
        language: system
        stages: [post-rewrite]
        always_run: true
        pass_filenames: false
      - id: dependency-freshness
        name: dependencies on newest stable
        entry: scripts/check_dependency_freshness.sh
        language: system
        pass_filenames: true
        files: >-
          (pyproject\.toml|requirements.*\.txt|pubspec\.(yaml|lock)|\.fvmrc
          |\.github/workflows/.*\.ya?ml)$
      - id: repo-contract
        name: repo contract (CLAUDE.md Commands + test_changed)
        entry: scripts/check_repo_contract.sh
        language: system
        pass_filenames: false
        files: ^(CLAUDE\.md|AGENTS\.md|scripts/test_changed\.sh)$|(^|/)(AndroidManifest\.xml|build\.gradle(\.kts)?|strings\.xml|pubspec\.yaml|repo-contract\.toml|[^/]+\.desktop|assets/icon/[^/]+\.png)$
      # The Flutter client (app/). fvm runs the SDK pinned in app/.fvmrc; the
      # Python CI job skips this one, the flutter job runs the same analyze.
      - id: flutter-analyze
        name: flutter analyze (app/)
        entry: bash -c 'cd app && fvm flutter analyze --no-pub'
        language: system
        pass_filenames: false
        files: ^app/.*\.(dart|yaml)$
