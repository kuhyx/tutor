# tutor's commit gate: the same Python hooks as the sibling guard repos
default_language_version:
  python: python3
default_stages: [pre-commit]
fail_fast: false
exclude: ^build/
default_install_hook_types: [pre-commit, post-commit, post-merge, post-rewrite]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: debug-statements
      - id: check-ast
      - id: mixed-line-ending
        args: [--fix=lf]
  - repo: local
    hooks:
      - id: no-noqa
        name: Block noqa comments
        entry: '(?i)#\s*(noqa|type:\s*ignore)'
        language: pygrep
        types: [python]
      - id: no-ruff-noqa
        name: Block ruff noqa file-level comments
        entry: '(?i)#\s*ruff:\s*noqa'
        language: pygrep
        types: [python]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-format
        types_or: [python, pyi]
  - repo: local
    hooks:
      # Always under 60 s: a pass stamp for the staged tree (written by
      # `.venv/bin/python scripts/pytest_stamp.py run`, chunked, 100% branch
      # coverage) passes instantly; a small change runs inline; anything bigger
      # fails fast with that command. require_serial: one process, not one per
      # CPU, since pre-commit would otherwise split the file list across jobs.
      - id: pytest
        name: pytest (pass stamp, else changed files)
        entry: .venv/bin/python scripts/pytest_changed.py
        language: system
        files: ^(.*\.py|pyproject\.toml)$
        require_serial: true
  - repo: local
    hooks:
      - id: no-silent-failures
        name: Block silent failures (swallowed exceptions must log why)
        entry: python3 scripts/check_silent_failures.py
        language: system
        types: [python]
        # code_runner turns hostile sandbox output into error results on purpose;
        # moved verbatim from utils (follow-up: log those handlers, drop this).
        exclude: ^packages/code_runner/
      - id: md-naming
        name: markdown naming convention
        entry: scripts/check_md_naming.sh
        language: system
        files: \.(md|markdown)$

      - id: todo-closer
        name: close Todo trailer tasks
        entry: scripts/todo_hooks.sh closer
        language: system
        stages: [post-commit]
        always_run: true
        pass_filenames: false

      - id: todo-import-pr-merge
        name: import PR Todo sections (pull)
        entry: scripts/todo_hooks.sh import-pr post-merge
        language: system
        stages: [post-merge]
        always_run: true
        pass_filenames: false

      - id: todo-import-pr-rewrite
        name: import PR Todo sections (pull --rebase)
        entry: scripts/todo_hooks.sh import-pr post-rewrite
        language: system
        stages: [post-rewrite]
        always_run: true
        pass_filenames: false
      - id: dependency-freshness
        name: dependencies on newest stable
        entry: scripts/check_dependency_freshness.sh
        language: system
        pass_filenames: true
        files: >-
          (pyproject\.toml|requirements.*\.txt|pubspec\.(yaml|lock)|\.fvmrc
          |\.github/workflows/.*\.ya?ml)$
      - id: repo-contract
        name: repo contract (CLAUDE.md Commands + test_changed)
        entry: scripts/check_repo_contract.sh
        language: system
        pass_filenames: false
        files: ^(CLAUDE\.md|AGENTS\.md|scripts/test_changed\.sh)$|(^|/)(AndroidManifest\.xml|build\.gradle(\.kts)?|strings\.xml|pubspec\.yaml|repo-contract\.toml|[^/]+\.desktop|assets/icon/[^/]+\.png)$
