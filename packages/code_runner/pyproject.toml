[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "code_runner"
version = "0.1.1"
description = "Run a learner solution (Python, JavaScript, TypeScript) against a problem's examples in a bubblewrap sandbox"
requires-python = ">=3.14"
# Stdlib only on purpose: the tutor server imports it from the system python.
dependencies = []

[tool.setuptools.packages.find]
include = ["code_runner*"]

[tool.setuptools.package-data]
code_runner = ["py.typed", "harness/*"]

[tool.ruff]
target-version = "py314"
include = ["*.py", "**/*.py"]
exclude = [".git", ".venv", "__pycache__", "build", "dist", ".eggs"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY001",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D107",
    "D203",
    "D213",
    "COM812",
    "ISC001",
    "S603",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["INP001"]
# The sandbox-side harness is a program of its own: it reads its job from files.
# The sandbox mounts its own private tmpfs at /tmp.
"**/_sandbox.py" = ["S108"]
"**/harness/*.py" = ["INP001", "T201", "S102", "BLE001", "PTH123"]
# Tests embed the learner programs they run as source strings.
"**/tests/**/*.py" = ["ARG", "D", "E501", "PLC0415", "PLR2004", "S101", "SLF001"]
"**/test_*.py" = ["ARG", "D", "E501", "PLC0415", "PLR2004", "S101", "SLF001"]

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-single-line = false
force-sort-within-sections = true
known-first-party = ["code_runner"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

# Separate rcfile from the tutor's: the pre-commit gate runs pylint over this
# package with --rcfile=packages/code_runner/pyproject.toml. Docstrings are
# not required here (ruff's D1xx are off too); the tests are linted by ruff.
[tool.pylint.main]
py-version = "3.14"
ignore = [".venv", "__pycache__"]
# harness/ runs inside the sandbox and must exec the solution it is given.
ignore-paths = ["^(.*/)?tests/.*$", "^(.*/)?harness/.*$"]
ignore-patterns = [".*\\.pyi$"]

[tool.pylint.messages_control]
enable = "all"
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "use-implicit-booleaness-not-comparison-to-zero",
]

[tool.pylint.design]
max-args = 6
min-public-methods = 0
max-module-lines = 1000
max-attributes = 10
