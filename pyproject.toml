[project]
name = "tutor"
version = "0.1.0"
description = "A local tutor that teaches source-checked cards in conversation"
requires-python = ">=3.14"
license = "MIT"
# The excerpt check needs only the standard library plus poppler's pdftotext
# for PDF sources. The tutor itself needs:
# claude-agent-sdk (drives the logged-in claude CLI, no API key), starlette +
# uvicorn (the localhost page), schemdraw (code-drawn circuit diagrams), fsrs
# (spaced review, pinned: the Flutter client ports the same scheduler) and
# earned-time (the signed ledger the tutor's credit rows go in); the relay
# needs crdt-sync (the Firebase session) and httpx (RTDB REST + SSE; also
# what Starlette's TestClient needs).
dependencies = [
    "claude-agent-sdk==0.2.168",
    "fsrs==6.3.2",
    "starlette==1.8.0",
    "uvicorn==0.54.0",
    "schemdraw==0.23",
    "earned-time @ git+https://github.com/kuhyx/utils@earned-time-v0.13.2#subdirectory=earned_time",
    "crdt-sync @ git+https://github.com/kuhyx/utils@crdt-sync-v0.9.2#subdirectory=crdt-sync",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["mypy==2.4.0", "pylint==4.1.3", "pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.17.1"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tutor*"]

[tool.ruff]
target-version = "py314"
include = ["*.py", "**/*.py"]
exclude = [".git", ".venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203", "D213", "COM812", "ISC001", "S603",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = [
    "ANN", "ARG", "D", "E501", "FBT", "PLC0415", "PLR0913", "PLR2004", "PTH",
    "S101", "SLF001",
]
# Run by hand; their stdout lines are the evidence (canary, run, verdicts).
"tutor/__main__.py" = ["T201"]
"tutor/isolation.py" = ["T201"]
# Run by hand; its progress lines are the evidence the session ran.
"tutor/scripted.py" = ["T201"]
"tutor/adjudicate.py" = ["T201"]
"tutor/curriculum/migrate.py" = ["T201"]
# ``regenerate`` prints what it suspended and generated (the repair's record).
"tutor/curriculum/regen.py" = ["T201"]
# Dev tool: the printed JSON is the smoke run's evidence.
"scripts/curriculum_smoke.py" = ["T201"]
# ``publish-all`` prints its counts: the evidence the migration ran.
"tutor/relay/cli.py" = ["T201"]
# Sources are https URLs from the card files (cards.py rejects anything else).
"tutor/sources.py" = ["S310"]
# The MediaWiki API on two fixed https hosts (wiki.http_get refuses others).
"tutor/curriculum/wiki.py" = ["S310"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["tutor", "tests"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
ignore_missing_imports = true
show_error_codes = true
exclude = [".venv/"]

[tool.pylint.main]
py-version = "3.14"
jobs = 0
ignore = [".venv", "__pycache__"]
ignore-paths = ["^(.*/)?tests/.*$"]

[tool.pylint.messages_control]
enable = "all"
disable = [
    "use-implicit-booleaness-not-comparison",
    "use-implicit-booleaness-not-comparison-to-string",
    "use-implicit-booleaness-not-comparison-to-zero",
]

[tool.pylint.design]
min-public-methods = 0
# The tutor's turn / replay records carry 9-12 fields; same cap as testsAndMisc.
max-attributes = 12

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests", "tutor/tests"]
addopts = [
    "-q",
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=tutor",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]
filterwarnings = ["error::ResourceWarning"]

[tool.coverage.run]
omit = ["tests/*", "tutor/tests/*"]
