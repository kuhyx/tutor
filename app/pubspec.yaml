name: tutor
description: "Tutor: learn any subject with a PC tutor and offline spaced review."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

# Exact pins everywhere (newest stable, checked by
# scripts/check_dependency_freshness.sh); carets only for the SDK-coupled
# carve-outs the freshness rules allow.
dependencies:
  # FirebaseTokenProvider (Google sign-in -> refresh token -> idToken) and the
  # keystore-backed credential store. Data goes through lib/sync/rtdb_client
  # instead: crdt_sync's client only stores string leaves (DOCS-contract §2).
  crdt_sync:
    git:
      url: https://github.com/kuhyx/utils
      ref: crdt_sync_dart-v0.14.2
      path: crdt_sync_dart
  # E2E key in the OS keystore and the text-free passphrase lock button
  # (DOCS-contract §12).
  crdt_sync_flutter:
    git:
      url: https://github.com/kuhyx/utils
      ref: crdt_sync_flutter-v0.9.2
      path: crdt_sync_flutter
  # Chunked screenshot upload: sha256 of the decoded bytes (focus_evidence).
  crypto: 3.0.8
  # The shared palette, spacing and type scale. No local theme to drift from.
  design_system:
    git:
      url: https://github.com/kuhyx/utils
      ref: design_system-v0.3.1
      path: design_system
  # The rules screenshot of an interview project (Android picker / web input).
  file_picker: 13.4.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Refresh token in the Android keystore (DOCS-contract §10).
  flutter_secure_storage: 11.2.0
  # Worker-drawn circuit diagrams arrive as inline SVG (DOCS-contract §8).
  flutter_svg: 2.5.1
  # One-tap Google ID token via the framework AccountManager chooser (FOSS).
  google_account_token:
    git:
      url: https://github.com/kuhyx/utils
      ref: google_account_token-v0.1.0
      path: google_account_token
  http: 1.6.0
  # Device id and the offline event queue on web live in IndexedDB.
  idb_shim: 2.11.3
  intl: 0.20.3
  # kuhy's logo credit, top-left of the home screen.
  kuhy_credit:
    git:
      url: https://github.com/kuhyx/utils
      ref: kuhy-credit-v0.3.2
      path: kuhy_credit/flutter
  # crdt_sync_flutter's passphrase dialog is built from this Material copy:
  # MaterialApp must also hand it its own MaterialLocalizations (ui/app.dart).
  material_ui: 1.11.1
  # The relay client (RTDB REST/SSE, e2e sealing, request hub, rev watcher,
  # passphrase gate, session): shared with other apps' PC relays.
  rtdb_relay:
    git:
      url: https://github.com/kuhyx/utils
      ref: rtdb-relay-v0.2.2
      path: rtdb_relay/dart
  shared_preferences: 2.5.6
  # Source links and picture attribution open in the browser.
  url_launcher: 6.3.3
  uuid: 4.6.0

dev_dependencies:
  fake_async: 1.3.3
  # Android launcher icons from assets/icon/ (shared family generator in
  # testsAndMisc/python_pkg/app_icons).
  flutter_launcher_icons: 0.14.4
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
  # The web build (CanvasKit) has no system "monospace": code is drawn in
  # this bundled face everywhere (SQL, session code, card skeletons).
  fonts:
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#211D1B"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  min_sdk_android: 21
