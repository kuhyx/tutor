name: tutor
description: "Tutor: learn any subject with a PC tutor and offline spaced review."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

# Exact pins everywhere (newest stable, checked by
# scripts/check_dependency_freshness.sh); carets only for the SDK-coupled
# carve-outs the freshness rules allow.
dependencies:
  # FirebaseTokenProvider (Google sign-in -> refresh token -> idToken) and the
  # keystore-backed credential store. Data goes through lib/sync/rtdb_client
  # instead: crdt_sync's client only stores string leaves (DOCS-contract §2).
  crdt_sync:
    git:
      url: https://github.com/kuhyx/utils
      ref: crdt_sync_dart-v0.12.0
      path: crdt_sync_dart
  # The shared palette, spacing and type scale. No local theme to drift from.
  design_system:
    git:
      url: https://github.com/kuhyx/utils
      ref: design_system-v0.3.1
      path: design_system
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Refresh token in the Android keystore (DOCS-contract §10).
  flutter_secure_storage: 11.2.0
  # Worker-drawn circuit diagrams arrive as inline SVG (DOCS-contract §8).
  flutter_svg: 2.3.2
  # One-tap Google ID token via the framework AccountManager chooser (FOSS).
  google_account_token:
    git:
      url: https://github.com/kuhyx/utils
      ref: google_account_token-v0.1.0
      path: google_account_token
  http: 1.6.0
  # Device id and the offline event queue on web live in IndexedDB.
  idb_shim: 2.11.2
  intl: 0.20.3
  shared_preferences: 2.5.6
  # Source links and picture attribution open in the browser.
  url_launcher: 6.3.3
  uuid: 4.6.0

dev_dependencies:
  fake_async: 1.3.3
  # Android launcher icons from assets/icon/ (shared family generator in
  # testsAndMisc/python_pkg/app_icons).
  flutter_launcher_icons: 0.14.4
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#211D1B"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  min_sdk_android: 21
