<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Tutor: learn any subject with a PC tutor and spaced review.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Tutor">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Tutor</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // C4 window takeover (lib/ui/deep_link_web.dart). `tutor --route
    // /learn/...` (or `/review/...`, `/rework/...`) against a running profile opens a
    // SECOND --app window, and
    // a used window can never close itself (more than one history entry).
    // So this new window, before Flutter boots, offers its route to a tutor
    // window already open on this origin; once one answers "took", it closes
    // itself (one history entry: the browser lets a script close it). No
    // answer within a second, or the close refused: boot as usual.
    (function () {
      var boot = function () {
        var s = document.createElement('script');
        s.src = 'flutter_bootstrap.js';
        s.async = true;
        document.body.appendChild(s);
      };
      var route = decodeURIComponent(location.hash.slice(1));
      var handed = ['/learn/', '/review/', '/rework/'].some(function (p) {
        return route.indexOf(p) === 0;
      });
      if (!handed || !('BroadcastChannel' in window)) {
        boot();
        return;
      }
      var channel = new BroadcastChannel('tutor-window');
      var wait = setTimeout(function () { channel.close(); boot(); }, 1000);
      channel.onmessage = function (event) {
        if (event.data !== 'took ' + route) return;
        clearTimeout(wait);
        channel.close();
        window.close();
        setTimeout(boot, 500);
      };
      channel.postMessage('learn ' + route);
    })();
  </script>
</body>
</html>
